[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "shadowmcp"
version = "0.1.0"
description = "Local discovery of Model Context Protocol servers from real client configs and processes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.15",
  "pydantic>=2.10",
  "psutil>=6.1",
  "mcp>=1.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]
docker = ["docker>=7.1"]

[project.scripts]
shadowmcp = "shadowmcp.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowmcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shadowmcp"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]